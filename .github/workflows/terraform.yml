name: Terraform

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:
    inputs:
      plan_run_id:
        description: "ID of the push run whose reviewed plan should be applied."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: aws-legacy-migration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Terraform
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Check formatting
        run: terraform fmt -check -recursive terraform

      - name: Initialize without remote state
        run: terraform -chdir=terraform init -backend=false -input=false

      - name: Validate configuration
        run: terraform -chdir=terraform validate

  plan:
    name: Plan infrastructure
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_STATE_BUCKET: ${{ vars.TF_DATA_BUCKET || 'legacy-migration-lab' }}
      TF_AWS_REGION: ${{ vars.AWS_REGION || 'ca-central-1' }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION || 'ca-central-1' }}
      TF_VAR_bucket_name: ${{ vars.TF_DATA_BUCKET || 'legacy-migration-lab' }}
      TF_VAR_workgroup_name: ${{ vars.ATHENA_WORKGROUP || 'legacy-migration-lab' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ca-central-1' }}

      - name: Initialize Terraform
        run: >-
          terraform -chdir=terraform init -input=false
          -backend-config="bucket=$TF_STATE_BUCKET"
          -backend-config="key=aws-legacy-data-migration-lab/terraform.tfstate"
          -backend-config="region=$TF_AWS_REGION"
          -backend-config="encrypt=true"
          -backend-config="use_lockfile=true"

      - name: Create plan
        run: terraform -chdir=terraform plan -input=false -out=tfplan

      - name: Show plan for review
        run: terraform -chdir=terraform show -no-color tfplan

      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ github.run_id }}
          path: terraform/tfplan
          retention-days: 1

  apply:
    name: Apply infrastructure
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment: terraform-apply
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_STATE_BUCKET: ${{ vars.TF_DATA_BUCKET || 'legacy-migration-lab' }}
      TF_AWS_REGION: ${{ vars.AWS_REGION || 'ca-central-1' }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION || 'ca-central-1' }}
      TF_VAR_bucket_name: ${{ vars.TF_DATA_BUCKET || 'legacy-migration-lab' }}
      TF_VAR_workgroup_name: ${{ vars.ATHENA_WORKGROUP || 'legacy-migration-lab' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Verify reviewed plan run
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN_RUN_ID: ${{ inputs.plan_run_id }}
        run: |
          if [[ ! "$PLAN_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "plan_run_id must contain only digits."
            exit 1
          fi

          run_metadata="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PLAN_RUN_ID" \
            --jq '[.event, .head_branch, .head_sha, .status, .conclusion, .path] | @tsv')"
          IFS=$'\t' read -r event branch sha status conclusion workflow_path <<< "$run_metadata"
          workflow_path="${workflow_path%%@*}"

          if [[ "$event" != "push" ||
                "$branch" != "main" ||
                "$sha" != "$GITHUB_SHA" ||
                "$status" != "completed" ||
                "$conclusion" != "success" ||
                "$workflow_path" != ".github/workflows/terraform.yml" ]]; then
            echo "The plan run must be a successful push from the current main commit using this workflow."
            exit 1
          fi

      - name: Download plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan-${{ inputs.plan_run_id }}
          path: terraform
          run-id: ${{ inputs.plan_run_id }}
          github-token: ${{ github.token }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ca-central-1' }}

      - name: Initialize Terraform
        run: >-
          terraform -chdir=terraform init -input=false
          -backend-config="bucket=$TF_STATE_BUCKET"
          -backend-config="key=aws-legacy-data-migration-lab/terraform.tfstate"
          -backend-config="region=$TF_AWS_REGION"
          -backend-config="encrypt=true"
          -backend-config="use_lockfile=true"

      - name: Apply approved plan
        run: terraform -chdir=terraform apply -input=false tfplan
