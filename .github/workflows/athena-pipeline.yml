name: Athena data pipeline

on:
  pull_request:
    paths:
      - "config/**"
      - "data/**"
      - "sql/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/athena-pipeline.yml"
  workflow_dispatch:
    inputs:
      confirm_run:
        description: "Choose yes to upload source data and create the curated table."
        required: true
        type: choice
        options:
          - "no"
          - "yes"
        default: "no"

permissions:
  contents: read

concurrency:
  group: aws-legacy-migration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate pipeline inputs
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate CSV, configuration, and SQL inputs
        run: python scripts/run_athena_pipeline.py
        env:
          TF_DATA_BUCKET: ${{ vars.TF_DATA_BUCKET || 'legacy-migration-lab' }}
          VALIDATE_ONLY: "true"

      - name: Run unit tests
        run: python -m unittest discover -s tests

  run-pipeline:
    name: Upload data and run Athena CTAS
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm_run == 'yes'
    needs: validate
    runs-on: ubuntu-latest
    environment: terraform-apply
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ca-central-1' }}
      TF_DATA_BUCKET: ${{ vars.TF_DATA_BUCKET || 'legacy-migration-lab' }}
      ATHENA_WORKGROUP: ${{ vars.ATHENA_WORKGROUP || 'legacy-migration-lab' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ca-central-1' }}

      - name: Run Athena data pipeline
        run: python scripts/run_athena_pipeline.py
